<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>2300 GT — Stage 0 Magnetic 3D Prototype v3</title>
<style>
  :root {
    --cyan: #00f0ff;
    --magenta: #ff2a85;
    --emerald: #06d6a0;
    --crimson: #ff3b5c;
    --gold: #ffd166;
    --bg: #050211;
    --panel: rgba(9, 5, 25, 0.74);
    --border: rgba(0, 240, 255, 0.36);
  }
  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    touch-action: none;
  }
  #proto-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
    flex-wrap: wrap;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 5px 9px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .label {
    font-size: 8.5px;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    font-weight: 700;
  }
  .val {
    font-size: 14px;
    font-weight: 900;
    color: var(--cyan);
    line-height: 1.15;
  }
  .val.gold { color: var(--gold); }
  .val.mag { color: var(--magenta); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .btn-small {
    pointer-events: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 9px;
    padding: 7px 10px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;

    border-color: var(--magenta);

  #diag-box {
    position: fixed;
    top: 96px;

  }
  #diag-box.show { display: block; }
  .touch-controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(12px, env(safe-area-inset-bottom));
    padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 11;

  .touch-group { display: flex; gap: 9px; pointer-events: none; }
  .t-btn {
    pointer-events: auto;
    width: 66px;
    height: 66px;

    color: #fff;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.8px;
    display: flex;
    flex-direction: column;

    font-size: 10px;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.74);
    background: rgba(8,4,22,0.68);
    padding: 4px 10px;
    border-radius: 999px;
    text-align: center;
    white-space: normal;
    line-height: 1.25;
  }
</style>

<body>
  <canvas id="proto-canvas"></canvas>

  <div id="hud">
    <div class="top-bar">
      <div class="row">
        <div class="card">
          <div class="label">SECTOR</div>

      <div class="row">

      </div>

    <div id="diag-box"></div>
    <div class="hint">STAGE 0 v3 • Steer to counter curve drift • Mag Lock holds surface • R = Reset</div>

    <div class="touch-controls">
      <div class="touch-group">
        <button class="t-btn" id="btn-left" type="button">◀<span>LEFT</span></button>
        <button class="t-btn" id="btn-right" type="button">▶<span>RIGHT</span></button>
      </div>
      <div class="touch-group">
        <button class="t-btn nitro" id="btn-nitro" type="button">⚡<span>NITRO</span></button>
        <button class="t-btn brake" id="btn-brake" type="button">▼<span>BRAKE</span></button>
        <button class="t-btn gas" id="btn-gas" type="button">▲<span>GAS</span></button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const TUNING = {
      samples: 1200,
      trackWidth: 26,
      hoverHeight: 0.22,
      gravity: 22.0,
      magMaxAccel: 95.0,
      magSpringK: 150.0,
      magDampingC: 28.0,

      // Speedboat-inspired forward & lateral momentum with curve-induced drift
      maxForwardSpeed: 82.0,
      nitroMaxSpeedBonus: 24.0,
      accelThrust: 50.0,
      nitroThrustBonus: 36.0,
      brakeDecel: 66.0,
      glideDrag: 8.5,
      reverseMaxSpeed: 20.0,

      maxLatSpeed: 34.0,
      latCarveAccel: 46.0,
      latGripDamping: 3.1,          // Lower grip allows real outward curve drift that player must steer into
      curveDriftFactor: 0.34,       // Outward lateral acceleration proportional to v^2 * curvature
      gravityLatFactor: 0.42,       // Banked/vertical gravity pull across the deck
      baseTurnRate: 2.55,
      headingStabilizeK: 1.55,      // Gentle restoring rate so drift/carves feel physical rather than snapped
      maxSlipHeading: 0.48,

      nitroShotCost: 100 / 3,
      nitroDuration: 1.8,
      nitroCooldown: 1.0,
      nitroRegen: 8.5
    };

    function smoothstep(edge0, edge1, x) {
      const t = THREE.MathUtils.clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    /**
     * Smooth, wide, non-self-intersecting 6-sector 3D course:
     * 1. Horizontal straight
     * 2. Banked turn
     * 3. Vertical climb
     * 4. Full inverted loop (62m radius with lateral separation so entry & exit never cross)
     * 5. Corkscrew (smooth helical barrel-roll turn)
     * 6. Wide horizontal return sweeping back to start
     */
    function buildStage0CourseFrames() {
      const pts = [];
      const bankKeys = []; // { u, bank, sector }

      const appendCurvePoints = (curve3d, count, uStart, uEnd, bankStart, bankEnd, sectorName) => {
        const sampled = curve3d.getPoints(count);
        const startIdx = pts.length === 0 ? 0 : 1;
        for (let i = startIdx; i < sampled.length; i++) {
          const frac = i / (sampled.length - 1);
          pts.push(sampled[i]);
          bankKeys.push({
            u: THREE.MathUtils.lerp(uStart, uEnd, frac),
            bank: THREE.MathUtils.lerp(bankStart, bankEnd, smoothstep(0, 1, frac)),
            sector: sectorName
          });
        }
      };

      // 1. Horizontal straight along -Z
      const seg1 = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -95),
        new THREE.Vector3(0, 0, -190)
      ]);
      appendCurvePoints(seg1, 80, 0.0, 0.14, 0.0, 0.0, '1. HORIZONTAL STRAIGHT');

      // 2. Wide banked turn sweeping +X and -Z with smooth entry/exit bank ramp
      const seg2 = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, -190),
        new THREE.Vector3(45, 2, -285),
        new THREE.Vector3(145, 6, -345),
        new THREE.Vector3(255, 4, -345)
      ]);
      appendCurvePoints(seg2, 100, 0.14, 0.30, 0.0, 0.64, '2. BANKED TURN');

      // 3. Steep vertical climb rising +74m while unbanking smoothly
      const seg3 = new THREE.CatmullRomCurve3([
        new THREE.Vector3(255, 4, -345),
        new THREE.Vector3(325, 26, -345),
        new THREE.Vector3(375, 56, -345),
        new THREE.Vector3(405, 78, -345)
      ]);
      appendCurvePoints(seg3, 85, 0.30, 0.43, 0.64, 0.0, '3. VERTICAL CLIMB');

      // 4. Full inverted loop (62m radius vertical circle with smooth +Z offset so entry/exit stay apart)
      const lBase = new THREE.Vector3(405, 78, -345);
      const loopR = 62;
      const loopPts = [];
      const loopSteps = 150;
      for (let i = 0; i <= loopSteps; i++) {
        const t = i / loopSteps;
        const theta = -Math.PI * 0.5 + t * Math.PI * 2;
        loopPts.push(new THREE.Vector3(
          lBase.x + Math.cos(theta) * loopR,
          lBase.y + (Math.sin(theta) + 1) * loopR,
          lBase.z + smoothstep(0, 1, t) * 68
        ));
      }
      const seg4 = new THREE.CatmullRomCurve3(loopPts);
      appendCurvePoints(seg4, 150, 0.43, 0.65, 0.0, 0.0, '4. INVERTED LOOP');

      // 5. Corkscrew (sweeping toward +Z and descending smoothly with a full 360 deg barrel roll)
      const sBase = loopPts[loopPts.length - 1].clone();
      const screwPts = [];
      const screwSteps = 150;
      for (let i = 0; i <= screwSteps; i++) {
        const t = i / screwSteps;
        const turnA = t * Math.PI * 0.55;
        const r = 185;
        const wave = Math.sin(t * Math.PI * 2) * 11;
        screwPts.push(new THREE.Vector3(
          sBase.x + Math.sin(turnA) * r,
          sBase.y - smoothstep(0, 1, t) * 42 + wave,
          sBase.z + (1 - Math.cos(turnA)) * r + wave * 0.75
        ));
      }
      const seg5 = new THREE.CatmullRomCurve3(screwPts);
      appendCurvePoints(seg5, 150, 0.65, 0.84, 0.0, Math.PI * 2, '5. CORKSCREW');

      // 6. Wide horizontal return sweeping back to start
      const rBase = screwPts[screwPts.length - 1].clone();
      const seg6 = new THREE.CatmullRomCurve3([
        rBase,
        new THREE.Vector3(rBase.x - 10, 12, 165),
        new THREE.Vector3(235, 0, 210),
        new THREE.Vector3(65, 0, 200),
        new THREE.Vector3(0, 0, 115),
        new THREE.Vector3(0, 0, 0)
      ]);
      appendCurvePoints(seg6, 130, 0.84, 1.0, Math.PI * 2, Math.PI * 2, '6. HORIZONTAL RETURN');

      const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.45);
      const totalLength = curve.getLength();
      const N = TUNING.samples;

      const getBankAndSectorAtU = (u) => {
        for (let i = 0; i < bankKeys.length - 1; i++) {
          const a = bankKeys[i];
          const b = bankKeys[i + 1];
          if (u >= a.u && u <= b.u) {
            const span = Math.max(1e-6, b.u - a.u);
            const alpha = THREE.MathUtils.clamp((u - a.u) / span, 0, 1);
            return {
              bank: THREE.MathUtils.lerp(a.bank, b.bank, alpha),
              sector: alpha < 0.5 ? a.sector : b.sector
            };
          }
        }
        const last = bankKeys[bankKeys.length - 1];
        return { bank: last.bank, sector: last.sector };
      };

      // Parallel-transport frame along closed spline
      let prevTangent = curve.getTangentAt(0).normalize();
      let refNormal = new THREE.Vector3(0, 1, 0);
      refNormal.sub(prevTangent.clone().multiplyScalar(refNormal.dot(prevTangent))).normalize();
      if (refNormal.lengthSq() < 0.001) refNormal = new THREE.Vector3(1, 0, 0);

      const rawFrames = [];
      for (let i = 0; i < N; i++) {
        const u = i / N;
        const pos = curve.getPointAt(u);
        const tangent = curve.getTangentAt(u).normalize();

        const rotAxis = new THREE.Vector3().crossVectors(prevTangent, tangent);
        const sinAngle = rotAxis.length();
        if (sinAngle > 1e-6) {
          rotAxis.normalize();
          const angle = Math.asin(Math.min(1, sinAngle));
          refNormal.applyAxisAngle(rotAxis, angle);
          refNormal.sub(tangent.clone().multiplyScalar(refNormal.dot(tangent))).normalize();
        }

        const { bank, sector } = getBankAndSectorAtU(u);
        const bankedNormal = refNormal.clone().applyAxisAngle(tangent, bank).normalize();
        const right = new THREE.Vector3().crossVectors(tangent, bankedNormal).normalize();
        const normal = new THREE.Vector3().crossVectors(right, tangent).normalize();

        rawFrames.push({
          index: i,
          u,
          s: u * totalLength,
          pos,
          tangent,
          normal,
          right,
          curvature: 0,
          sector
        });

        prevTangent = tangent;
      }

      // Distribute loop closure roll discrepancy smoothly and compute signed lateral curvature
      const n0 = rawFrames[0].normal;
      const nEnd = rawFrames[N - 1].normal;
      const t0 = rawFrames[0].tangent;
      const crossEnd = new THREE.Vector3().crossVectors(nEnd, n0);
      const closureAngle = Math.atan2(crossEnd.dot(t0), THREE.MathUtils.clamp(nEnd.dot(n0), -1, 1));

      const frames = [];
      for (let i = 0; i < N; i++) {
        const f = rawFrames[i];
        const fix = (closureAngle * i) / N;
        const fixedNormal = f.normal.clone().applyAxisAngle(f.tangent, fix).normalize();
        const fixedRight = new THREE.Vector3().crossVectors(f.tangent, fixedNormal).normalize();
        frames.push({
          ...f,
          normal: fixedNormal,
          right: fixedRight
        });
      }

      const dsStep = totalLength / N;
      for (let i = 0; i < N; i++) {
        const prevF = frames[(i - 1 + N) % N];
        const nextF = frames[(i + 1) % N];
        const dTds = nextF.tangent.clone().sub(prevF.tangent).divideScalar(2 * dsStep);
        // Positive curvature means turning toward +right
        frames[i].curvature = dTds.dot(frames[i].right);
      }

      return { curve, frames, totalLength };
    }

    function sampleFrameAtArcLength(trackData, sVal) {
      const { frames, totalLength } = trackData;
      const wrappedS = ((sVal % totalLength) + totalLength) % totalLength;
      const exactIdx = (wrappedS / totalLength) * frames.length;
      const i0 = Math.floor(exactIdx) % frames.length;
      const i1 = (i0 + 1) % frames.length;
      const alpha = exactIdx - Math.floor(exactIdx);

      const f0 = frames[i0];
      const f1 = frames[i1];

      const pos = new THREE.Vector3().lerpVectors(f0.pos, f1.pos, alpha);
      const tangent = new THREE.Vector3().lerpVectors(f0.tangent, f1.tangent, alpha).normalize();
      const normal = new THREE.Vector3().lerpVectors(f0.normal, f1.normal, alpha).normalize();
      const right = new THREE.Vector3().crossVectors(tangent, normal).normalize();
      const orthoNormal = new THREE.Vector3().crossVectors(right, tangent).normalize();
      const curvature = THREE.MathUtils.lerp(f0.curvature, f1.curvature, alpha);

      return {
        index: i0,
        s: wrappedS,
        pos,
        tangent,
        normal: orthoNormal,
        right,
        curvature,
        sector: alpha < 0.5 ? f0.sector : f1.sector
      };
    }

    function createTrackSurfaceTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0e0922';
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = 'rgba(0, 240, 255, 0.16)';
      ctx.lineWidth = 2;
      for (let x = 0; x <= 512; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
      }
      for (let y = 0; y <= 512; y += 64) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(0, 240, 255, 0.72)';
      ctx.lineWidth = 10;
      ctx.strokeRect(8, 0, 496, 512);

      ctx.strokeStyle = 'rgba(255, 42, 133, 0.55)';
      ctx.lineWidth = 5;
      ctx.setLineDash([26, 22]);
      ctx.beginPath();
      ctx.moveTo(256, 0);
      ctx.lineTo(256, 512);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 110);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function buildTrackVisuals(scene, trackData) {
      const group = new THREE.Group();
      const { frames, totalLength } = trackData;
      const N = frames.length;
      const halfW = TUNING.trackWidth * 0.5;

      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= N; i++) {
        const f = frames[i % N];
        const v = (i / N) * (totalLength / 16);
        const l = f.pos.clone().addScaledVector(f.right, -halfW);
        const r = f.pos.clone().addScaledVector(f.right, halfW);
        positions.push(l.x, l.y, l.z, r.x, r.y, r.z);
        uvs.push(0, v, 1, v);

        if (i < N) {
          const a = i * 2;
          const b = a + 1;
          const c = a + 2;
          const d = a + 3;
          indices.push(a, c, b, b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        map: createTrackSurfaceTexture(),
        roughness: 0.36,
        metalness: 0.45,
        side: THREE.DoubleSide
      });
      group.add(new THREE.Mesh(geo, mat));

      const railGeo = new THREE.BoxGeometry(0.4, 0.9, 1);
      const railMatL = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
      const railMatR = new THREE.MeshBasicMaterial({ color: 0xff2a85 });
      const step = 3;
      const count = Math.ceil(N / step);
      const instL = new THREE.InstancedMesh(railGeo, railMatL, count);
      const instR = new THREE.InstancedMesh(railGeo, railMatR, count);
      const dummy = new THREE.Object3D();

      let idx = 0;
      for (let i = 0; i < N; i += step) {
        const f = frames[i];
        const nextF = frames[(i + step) % N];
        const segLen = Math.max(0.6, f.pos.distanceTo(nextF.pos) * 1.04);

        const pL = f.pos.clone().addScaledVector(f.right, -halfW - 0.25).addScaledVector(f.normal, 0.45);
        dummy.position.copy(pL);
        dummy.up.copy(f.normal);
        dummy.lookAt(pL.clone().add(nextF.tangent));
        dummy.scale.set(1, 1, segLen);
        dummy.updateMatrix();
        instL.setMatrixAt(idx, dummy.matrix);

        const pR = f.pos.clone().addScaledVector(f.right, halfW + 0.25).addScaledVector(f.normal, 0.45);
        dummy.position.copy(pR);
        dummy.up.copy(f.normal);
        dummy.lookAt(pR.clone().add(nextF.tangent));
        dummy.scale.set(1, 1, segLen);
        dummy.updateMatrix();
        instR.setMatrixAt(idx, dummy.matrix);
        idx++;
      }
      group.add(instL, instR);

      const grid = new THREE.GridHelper(1600, 80, 0x7b2cbf, 0x1d0a3b);
      grid.position.y = -16;
      group.add(grid);

      scene.add(group);
      return group;
    }

    function buildHoverCraftMesh() {
      const root = new THREE.Group();
      const bodyGroup = new THREE.Group();
      root.add(bodyGroup);

      const hullMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.22, metalness: 0.78 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x101428, roughness: 0.4, metalness: 0.65 });
      const canopyMat = new THREE.MeshStandardMaterial({ color: 0x07172b, roughness: 0.08, metalness: 0.92 });
      const accentMat = new THREE.MeshBasicMaterial({ color: 0xff2a85 });
      const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2a55 });

      const hull = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.46, 4.3), hullMat);
      hull.position.set(0, 0.62, 0);
      bodyGroup.add(hull);

      const nose = new THREE.Mesh(new THREE.ConeGeometry(1.05, 1.8, 4), hullMat);
      nose.rotation.x = -Math.PI * 0.5;
      nose.rotation.y = Math.PI * 0.25;
      nose.scale.set(1.25, 1, 0.35);
      nose.position.set(0, 0.54, -2.6);
      bodyGroup.add(nose);

      const canopy = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.4, 1.8), canopyMat);
      canopy.position.set(0, 0.96, -0.15);
      bodyGroup.add(canopy);

      const podL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.34, 2.7), darkMat);
      podL.position.set(-1.1, 0.58, 0.25);
      const podR = podL.clone();
      podR.position.x = 1.1;
      bodyGroup.add(podL, podR);

      const stripL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.09, 3.8), accentMat);
      stripL.position.set(-1.32, 0.6, 0.15);
      const stripR = stripL.clone();
      stripR.position.x = 1.32;
      bodyGroup.add(stripL, stripR);

      const wing = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.1, 0.46), hullMat);
      wing.position.set(0, 1.28, 1.8);
      const tail = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.14, 0.1), tailMat);
      tail.position.set(0, 0.7, 2.16);
      bodyGroup.add(wing, tail);

      const flameMat = new THREE.MeshBasicMaterial({ color: 0xff2a85, transparent: true, opacity: 0.9 });
      const flameL = new THREE.Mesh(new THREE.ConeGeometry(0.24, 1.35, 10), flameMat);
      flameL.rotation.x = Math.PI * 0.5;
      flameL.position.set(-0.52, 0.62, 2.7);
      flameL.visible = false;
      const flameR = flameL.clone();
      flameR.position.x = 0.52;
      bodyGroup.add(flameL, flameR);

      return { root, bodyGroup, flameL, flameR };
    }

    class MagneticCraftSim {
      constructor(trackData) {
        this.trackData = trackData;
        this.visual = buildHoverCraftMesh();
        this.reset();
      }

      reset() {
        this.s = 8.0;
        this.currentFrame = sampleFrameAtArcLength(this.trackData, this.s);
        this.latOffset = 0;
        this.hoverClearance = TUNING.hoverHeight;
        this.normalVel = 0;

        this.forwardSpeed = 0;
        this.latSpeed = 0;       // positive = +right, negative = -right (left)
        this.yawAngle = 0;
        this.bankRoll = 0;

        this.nitro = 100;
        this.nitroTimer = 0;
        this.nitroCooldown = 0;

        this.lastNormalForceG = 1.0;
        this.worldPos = new THREE.Vector3();
        this._syncVisual(0, 0, this.currentFrame);
      }

      fireNitro() {
        if (this.nitroCooldown > 0) return false;
        if (this.nitro < TUNING.nitroShotCost - 0.01) return false;
        this.nitro = Math.max(0, this.nitro - TUNING.nitroShotCost);
        this.nitroTimer = TUNING.nitroDuration;
        this.nitroCooldown = TUNING.nitroCooldown;
        return true;
      }

      update(dt, inputState, nowMs) {
        if (this.nitroTimer > 0) this.nitroTimer = Math.max(0, this.nitroTimer - dt);
        if (this.nitroCooldown > 0) this.nitroCooldown = Math.max(0, this.nitroCooldown - dt);
        if (this.nitroTimer <= 0) {
          this.nitro = Math.min(100, this.nitro + TUNING.nitroRegen * dt);
        }

        const steerInput = (inputState.left ? 1 : 0) - (inputState.right ? 1 : 0);
        const gas = inputState.gas ? 1 : 0;
        const brake = inputState.brake ? 1 : 0;

        const frame = this.currentFrame;
        const gravityWorld = new THREE.Vector3(0, -TUNING.gravity, 0);
        const gravAlongTangent = gravityWorld.dot(frame.tangent);
        const gravAlongNormal = gravityWorld.dot(frame.normal);
        const gravAlongRight = gravityWorld.dot(frame.right);

        // Forward momentum, climb/descent gravity, and Nitro boost
        const boosting = this.nitroTimer > 0;
        const topSpeed = TUNING.maxForwardSpeed + (boosting ? TUNING.nitroMaxSpeedBonus : 0);
        const thrust = gas * (TUNING.accelThrust + (boosting ? TUNING.nitroThrustBonus : 0));

        if (gas > 0 || boosting) {
          this.forwardSpeed += (thrust + gravAlongTangent * 0.35) * dt;
        } else if (brake > 0) {
          if (this.forwardSpeed > 1.5) {
            this.forwardSpeed -= TUNING.brakeDecel * dt;
          } else {
            this.forwardSpeed = Math.max(-TUNING.reverseMaxSpeed, this.forwardSpeed - 26 * dt);
          }
        } else {
          this.forwardSpeed += gravAlongTangent * 0.35 * dt;
          if (this.forwardSpeed > 0) {
            this.forwardSpeed = Math.max(0, this.forwardSpeed - TUNING.glideDrag * dt);
          } else if (this.forwardSpeed < 0) {
            this.forwardSpeed = Math.min(0, this.forwardSpeed + TUNING.glideDrag * dt);
          }
        }
        this.forwardSpeed = THREE.MathUtils.clamp(this.forwardSpeed, -TUNING.reverseMaxSpeed, topSpeed);

        // Curve-induced outward lateral drift + active steering carve/counter-steer
        // In right-handed (tangent x normal = right): curving toward +right throws craft outward (-right),
        // and pressing LEFT (+steerInput) pushes toward -right while RIGHT (-steerInput) pushes toward +right.
        const speedRatio = THREE.MathUtils.clamp(Math.abs(this.forwardSpeed) / 35, 0.25, 1.0);
        const dirSign = this.forwardSpeed >= -0.2 ? 1 : -1;

        const curveOutwardAccel = -frame.curvature * this.forwardSpeed * this.forwardSpeed * TUNING.curveDriftFactor;
        const playerLatAccel = -steerInput * TUNING.latCarveAccel * speedRatio;
        const gravLatAccel = gravAlongRight * TUNING.gravityLatFactor;

        this.latSpeed += (curveOutwardAccel + playerLatAccel + gravLatAccel) * dt;
        this.latSpeed *= Math.exp(-TUNING.latGripDamping * dt);
        this.latSpeed = THREE.MathUtils.clamp(this.latSpeed, -TUNING.maxLatSpeed, TUNING.maxLatSpeed);

        // Yaw reflects active steering plus drift slip angle; restoring force prevents uncontrolled spin
        this.yawAngle += steerInput * TUNING.baseTurnRate * speedRatio * dirSign * dt;
        const slipYaw = THREE.MathUtils.clamp(
          (this.latSpeed / TUNING.maxLatSpeed) * TUNING.maxSlipHeading,
          -TUNING.maxSlipHeading,
          TUNING.maxSlipHeading
        );
        this.yawAngle = THREE.MathUtils.lerp(
          this.yawAngle,
          slipYaw + steerInput * 0.14,
          Math.min(1, TUNING.headingStabilizeK * dt)
        );
        this.yawAngle = THREE.MathUtils.clamp(this.yawAngle, -TUNING.maxSlipHeading * 1.25, TUNING.maxSlipHeading * 1.25);

        // Deterministic arc-length progress along spline + lateral offset across track deck
        const ds = this.forwardSpeed * Math.cos(this.yawAngle) * dt;
        const dd = (this.latSpeed - this.forwardSpeed * Math.sin(this.yawAngle)) * dt;

        this.s = (this.s + ds + this.trackData.totalLength) % this.trackData.totalLength;
        this.currentFrame = sampleFrameAtArcLength(this.trackData, this.s);

        this.latOffset += dd;
        const maxLat = TUNING.trackWidth * 0.5 - 1.5;
        if (Math.abs(this.latOffset) > maxLat) {
          this.latOffset = Math.sign(this.latOffset) * maxLat;
          // Glancing edge deflection so hitting an outer curve requires steering correction rather than stalling
          this.latSpeed *= -0.32;
          this.yawAngle *= 0.55;
          this.forwardSpeed *= 0.985;
        }

        // Magnetic surface lock normal spring-damper countering gravity
        const magAccel = THREE.MathUtils.clamp(
          TUNING.magSpringK * (TUNING.hoverHeight - this.hoverClearance) -
          TUNING.magDampingC * this.normalVel -
          gravAlongNormal,
          -TUNING.magMaxAccel,
          TUNING.magMaxAccel
        );
        this.normalVel += (magAccel + gravAlongNormal) * dt;
        this.hoverClearance += this.normalVel * dt;
        if (this.hoverClearance < 0.02) {
          this.hoverClearance = 0.02;
          if (this.normalVel < 0) this.normalVel = 0;
        }
        this.lastNormalForceG = Math.abs(magAccel) / TUNING.gravity;

        this.worldPos
          .copy(this.currentFrame.pos)
          .addScaledVector(this.currentFrame.right, this.latOffset)
          .addScaledVector(this.currentFrame.normal, this.hoverClearance);

        this._syncVisual(dt, steerInput, nowMs, this.currentFrame);
      }

      _syncVisual(dt, steerInput, nowMs, frame) {
        const f = frame || this.currentFrame;
        this.visual.root.position.copy(this.worldPos);

        const forward = f.tangent.clone().negate();
        const basis = new THREE.Matrix4().makeBasis(f.right, f.normal, forward);
        const surfaceQuat = new THREE.Quaternion().setFromRotationMatrix(basis);
        const yawQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), this.yawAngle);
        this.visual.root.quaternion.copy(surfaceQuat).multiply(yawQuat);

        const bob = Math.sin((nowMs || 0) * 0.006) * 0.06 + 0.08;
        this.visual.bodyGroup.position.y = bob;

        const targetRoll = -steerInput * 0.18 + (this.latSpeed / TUNING.maxLatSpeed) * 0.22;
        this.bankRoll = THREE.MathUtils.lerp(this.bankRoll, targetRoll, Math.min(1, dt * 10 || 1));
        this.visual.bodyGroup.rotation.z = this.bankRoll;

        const boosting = this.nitroTimer > 0;
        this.visual.flameL.visible = boosting;
        this.visual.flameR.visible = boosting;
      }
    }

    class SurfaceChaseCamera {
      constructor(camera) {
        this.camera = camera;
        this.pos = new THREE.Vector3(0, 6, 12);
        this.up = new THREE.Vector3(0, 1, 0);
        this.lookTarget = new THREE.Vector3(0, 1, -10);
      }

      reset(craft) {
        const f = craft.currentFrame;
        this.pos.copy(craft.worldPos)
          .addScaledVector(f.tangent, -9.2)
          .addScaledVector(f.normal, 4.0);
        this.up.copy(f.normal);
        this.lookTarget.copy(craft.worldPos).addScaledVector(f.tangent, 13.0);
        this.camera.position.copy(this.pos);
        this.camera.up.copy(this.up);
        this.camera.lookAt(this.lookTarget);
      }

      update(craft, dt) {
        const f = craft.currentFrame;
        const dist = 9.0 + Math.max(0, craft.forwardSpeed) * 0.015;
        const height = 3.9 + Math.max(0, craft.forwardSpeed) * 0.006;

        const desiredPos = craft.worldPos.clone()
          .addScaledVector(f.tangent, -dist)
          .addScaledVector(f.right, craft.yawAngle * 2.0)
          .addScaledVector(f.normal, height);

        const desiredLook = craft.worldPos.clone()
          .addScaledVector(f.tangent, 13.5)
          .addScaledVector(f.right, -craft.yawAngle * 2.8)
          .addScaledVector(f.normal, 1.2);

        // Faster tracking on normal & position keeps craft framed cleanly through loops & corkscrews
        this.pos.lerp(desiredPos, Math.min(1, dt * 14.0));
        this.up.lerp(f.normal, Math.min(1, dt * 12.0)).normalize();
        this.lookTarget.lerp(desiredLook, Math.min(1, dt * 16.0));

        this.camera.position.copy(this.pos);
        this.camera.up.copy(this.up);
        this.camera.lookAt(this.lookTarget);
      }
    }

    function bindInput(craft, onReset) {
      const state = { left: false, right: false, gas: false, brake: false };
      const activePointers = new Map();

      const setKey = (key, pressed) => {
        state[key] = pressed;
      };

      const bindHold = (id, key) => {
        const el = document.getElementById(id);
        el.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          el.setPointerCapture(e.pointerId);
          activePointers.set(e.pointerId, { key, el });
          el.classList.add('pressed');
          setKey(key, true);
        }, { passive: false });

        const release = (e) => {
          const entry = activePointers.get(e.pointerId);
          if (!entry || entry.key !== key) return;
          activePointers.delete(e.pointerId);
          entry.el.classList.remove('pressed');
          setKey(key, false);
        };

        el.addEventListener('pointerup', release, { passive: false });
        el.addEventListener('pointercancel', release, { passive: false });
        el.addEventListener('lostpointercapture', release, { passive: false });
      };

      bindHold('btn-left', 'left');
      bindHold('btn-right', 'right');
      bindHold('btn-gas', 'gas');
      bindHold('btn-brake', 'brake');

      const nitroBtn = document.getElementById('btn-nitro');
      nitroBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        nitroBtn.setPointerCapture(e.pointerId);
        nitroBtn.classList.add('pressed');
        craft.fireNitro();
      }, { passive: false });
      const nitroUp = (e) => {
        nitroBtn.classList.remove('pressed');
        if (nitroBtn.hasPointerCapture(e.pointerId)) nitroBtn.releasePointerCapture(e.pointerId);
      };
      nitroBtn.addEventListener('pointerup', nitroUp, { passive: false });
      nitroBtn.addEventListener('pointercancel', nitroUp, { passive: false });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') setKey('left', true);
        if (e.code === 'ArrowRight' || e.code === 'KeyD') setKey('right', true);
        if (e.code === 'ArrowUp' || e.code === 'KeyW') setKey('gas', true);
        if (e.code === 'ArrowDown' || e.code === 'KeyS') setKey('brake', true);
        if (e.code === 'Space') { e.preventDefault(); craft.fireNitro(); }
        if (e.code === 'KeyR') onReset();
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') setKey('left', false);
        if (e.code === 'ArrowRight' || e.code === 'KeyD') setKey('right', false);
        if (e.code === 'ArrowUp' || e.code === 'KeyW') setKey('gas', false);
        if (e.code === 'ArrowDown' || e.code === 'KeyS') setKey('brake', false);
      });

      const clearInputs = () => {
        activePointers.clear();
        state.left = state.right = state.gas = state.brake = false;
        document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('pressed'));
      };
      window.addEventListener('blur', clearInputs);
      document.addEventListener('visibilitychange', () => { if (document.hidden) clearInputs(); });

      return state;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('proto-canvas');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060214);
      scene.fog = new THREE.FogExp2(0x08031c, 0.0019);

      const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.2, 1300);
      const chaseCam = new SurfaceChaseCamera(camera);

      scene.add(new THREE.HemisphereLight(0x8be9fd, 0x1c0a3a, 1.2));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.35);
      dirLight.position.set(160, 260, 110);
      scene.add(dirLight);

      const trackData = buildStage0CourseFrames();
      buildTrackVisuals(scene, trackData);

      const craft = new MagneticCraftSim(trackData);
      scene.add(craft.visual.root);
      chaseCam.reset(craft);

      const resetFn = () => {
        craft.reset();
        chaseCam.reset(craft);
      };
      const inputState = bindInput(craft, resetFn);
      document.getElementById('btn-reset').addEventListener('click', resetFn);

      let diagEnabled = false;
      const diagBox = document.getElementById('diag-box');
      const diagBtn = document.getElementById('btn-diag');
      diagBtn.addEventListener('click', () => {
        diagEnabled = !diagEnabled;
        diagBtn.classList.toggle('active', diagEnabled);
        diagBox.classList.toggle('show', diagEnabled);
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      });

      const frameTimes = [];
      let lastNow = performance.now();

      const loop = (now) => {
        const rawDt = (now - lastNow) / 1000;
        lastNow = now;
        const dt = Math.min(Math.max(rawDt, 0.001), 0.05);

        frameTimes.push(rawDt * 1000);
        if (frameTimes.length > 120) frameTimes.shift();

        craft.update(dt, inputState, now);
        chaseCam.update(craft, dt);

        const f = craft.currentFrame;
        document.getElementById('hud-sector').textContent = f.sector;
        document.getElementById('hud-mag').textContent = `LOCKED • ${craft.lastNormalForceG.toFixed(2)}G`;
        document.getElementById('hud-speed').textContent = Math.round(Math.abs(craft.forwardSpeed) * 3.6);
        document.getElementById('hud-nitro').textContent = `${Math.round(craft.nitro)}%`;

        const nitroBtn = document.getElementById('btn-nitro');
        nitroBtn.classList.toggle('locked', craft.nitroCooldown > 0 || craft.nitro < TUNING.nitroShotCost);

        if (diagEnabled) {
          const avgMs = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
          const sorted = [...frameTimes].sort((a, b) => a - b);
          const p95Ms = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.95))];
          const fps = 1000 / Math.max(avgMs, 0.001);
          diagBox.innerHTML =
            `FPS: ${fps.toFixed(1)} | AVG: ${avgMs.toFixed(1)}ms | P95: ${p95Ms.toFixed(1)}ms<br>` +
            `CALLS: ${renderer.info.render.calls} | TRIS: ${renderer.info.render.triangles}<br>` +
            `S: ${Math.round(f.s)}/${Math.round(trackData.totalLength)}m | LAT: ${craft.latOffset.toFixed(1)}m | LAT_V: ${craft.latSpeed.toFixed(1)}`;
        }

        renderer.render(scene, camera);
        requestAnimationFrame(loop);
      };

      requestAnimationFrame(loop);
    });
  </script>
